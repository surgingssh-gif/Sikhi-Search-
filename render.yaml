# Sikhe on Render: the API (always on, so the news refreshes by itself) and
# the website (a free static site). Render reads this file when you create a
# Blueprint from the GitHub repo. Secrets are never in this file: Render asks
# for ANTHROPIC_API_KEY when the Blueprint is first created.

services:
  - type: web
    name: sikhe-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: npm start -w @ask-sikhi/api
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # The website's address. If Render gives the site a different one, change it here and in the dashboard.
      - key: ALLOWED_ORIGINS
        value: https://sikhe-web.onrender.com
      - key: BANIDB_BASE_URL
        value: https://api.banidb.com/v2
      - key: AI_REQUESTS_PER_MINUTE
        value: "10"
      - key: LIBRARY_DIR
        value: /var/data/library
    # Researched library entries are kept on disk so each topic is only researched once.
    disk:
      name: sikhe-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: sikhe-web
    runtime: static
    buildCommand: npm ci && npm run build:web
    staticPublishPath: apps/sikhe/dist
    autoDeploy: true
    envVars:
      # The API's address, filled in by Render.
      - key: EXPO_PUBLIC_API_URL
        fromService:
          type: web
          name: sikhe-api
          property: host
    # Every page is served by the one app page; the app's router takes it from there.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
